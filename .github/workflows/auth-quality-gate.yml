name: Auth preview quality gate

on:
  push:
    branches:
      - 'feature/auth-first-pilot-*'
      - 'feature/level3-xuongphim-*'
      - 'feature/level3-completion-*'
    paths:
      - 'assets/auth.js'
      - 'assets/account.js'
      - 'assets/level3.js'
      - 'assets/studio.js'
      - 'assets/live-catalog.js'
      - 'assets/youtube-player.js'
      - 'admin.html'
      - 'assets/level3-video.js'
      - 'assets/level3.css'
      - 'member.html'
      - 'assets/app.js'
      - 'account.html'
      - 'assets/auth.css'
      - 'assets/auth-config.js'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/auth-quality-gate.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-checks:
    name: JavaScript syntax + auth contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check assets/auth.js
          node --check assets/account.js
          node --check assets/level3.js
          node --check assets/studio.js
          node --check assets/live-catalog.js
          node --check assets/youtube-player.js
          node --check assets/level3-video.js
          node --check assets/auth-config.js
          node --check assets/app.js
          node --check assets/sites.js
      - name: Verify auth contracts
        run: node --test tests/auth-contract.test.cjs tests/auth-account-menu.test.cjs
      - name: Install DOM test harness
        run: npm install --no-save --no-package-lock jsdom@26.1.0
      - name: Simulate viewer interactions on home and account pages
        run: node --test tests/auth-browser.test.cjs tests/level3-hub.test.cjs
