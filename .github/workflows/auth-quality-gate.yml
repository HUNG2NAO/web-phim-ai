name: Auth preview quality gate

on:
  push:
    branches:
      - 'feature/auth-first-pilot-*'
    paths:
      - 'assets/auth.js'
      - 'assets/auth.css'
      - 'assets/auth-config.js'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/auth-quality-gate.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-checks:
    name: JavaScript syntax + auth contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check assets/auth.js
          node --check assets/auth-config.js
          node --check assets/app.js
          node --check assets/sites.js
      - name: Verify auth-only logic contracts (no jsdom dependency)
        run: node --test tests/auth-contract.test.cjs tests/auth-account-menu.test.cjs
