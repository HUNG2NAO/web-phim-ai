<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Không tìm thấy trang</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e0c0a; color: #f0e7d6;
    font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 440px; text-align: center; }
  .code { font-size: 64px; font-weight: 800; letter-spacing: .04em; color: #d9a441; margin: 0; }
  h1 { font-size: 22px; margin: 8px 0 10px; }
  p { color: #a99b84; line-height: 1.6; margin: 0 0 22px; }
  a { display: inline-block; min-height: 44px; line-height: 44px; padding: 0 20px; border-radius: 10px; background: #d9a441; color: #1a1206; text-decoration: none; font-weight: 600; }
  a:focus-visible { outline: 2px solid #f0e7d6; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>Không tìm thấy trang này</h1>
  <p>Đường dẫn có thể đã thay đổi hoặc phim không còn được phát hành. Bạn quay lại trang chủ để tiếp tục xem phim nhé.</p>
  <a href="/">Về trang chủ</a>
</main>
</body>
</html>
