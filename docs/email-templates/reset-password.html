<!-- Supabase → Authentication → Emails → Templates → "Reset password"
     Subject: Đặt lại mật khẩu Xưởng Phim
     Liên kết dùng token_hash: mở được ở bất kỳ trình duyệt/điện thoại nào (không phụ thuộc PKCE). -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#1a1a1a">
  <h2 style="margin:0 0 12px">Đặt lại mật khẩu</h2>
  <p style="margin:0 0 16px;line-height:1.6">Chúng tôi nhận được yêu cầu đặt lại mật khẩu cho tài khoản Xưởng Phim của bạn. Liên kết chỉ dùng được một lần.</p>
  <p style="margin:0 0 24px"><a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=recovery"
     style="display:inline-block;padding:12px 22px;background:#22c3e6;color:#06121a;text-decoration:none;border-radius:8px;font-weight:bold">Đặt mật khẩu mới</a></p>
  <p style="margin:0;color:#666;font-size:13px;line-height:1.6">Nếu bạn không yêu cầu, hãy bỏ qua email này — mật khẩu hiện tại vẫn giữ nguyên.</p>
</div>
