<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phim AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Nền tảng xem phim do AI tạo.">
<meta name="theme-color" content="#0E0D0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="preview-bar" id="preview-bar" hidden>
  <div class="wrap">
    <span class="label">Xem thử giao diện</span>
    <div id="pv-pills" style="display:flex;flex-wrap:wrap;gap:6px"></div>
  </div>
</div>

<header class="site-header">
  <div class="wrap">
    <a href="./" class="logo" id="logo">Phim<span class="tld">.ai</span></a>
    <nav class="nav" aria-label="Danh mục">
      <button type="button" data-nav="home" aria-current="true">Trang chủ</button>
      <button type="button" data-nav="le">Phim lẻ</button>
      <button type="button" data-nav="bo">Phim bộ</button>
      <button type="button" data-nav="ngan">Phim ngắn</button>
    </nav>
    <form class="search" id="search-form" role="search">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Zm5.3-2.2L21 21"/></svg>
      <label for="q" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Tìm phim</label>
      <input id="q" type="search" placeholder="Tìm tên phim, thể loại…" autocomplete="off">
    </form>
  </div>
</header>

<div id="hero-slot"></div>
<main class="wrap" id="content"></main>

<footer class="site-footer">
  <div class="wrap">
    <div class="network-label">Cùng hệ thống phim AI</div>
    <div class="network" id="network"></div>
    <p class="fineprint"><span id="tagline"></span>. Toàn bộ phim trên hệ thống được sản xuất bằng công cụ trí tuệ nhân tạo. Phim đang hiển thị là nội dung mẫu.</p>
  </div>
</footer>

<dialog class="film" id="film-dialog" aria-labelledby="film-title">
  <button class="close" id="close-film" type="button" aria-label="Đóng">×</button>
  <div id="film-content"></div>
</dialog>

<script src="assets/sites.js"></script>
<script src="assets/films.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
